name: Publish to npm

# Runs when a GitHub release is published, for example tag v2.0.0.
# Uses npm Trusted Publishing (OIDC): no token. On npmjs.com, the package's Trusted Publisher must be
# GitHub Actions, user ducminhquan, repository qr-code-styling, workflow publish.yml.
# https://docs.npmjs.com/trusted-publishers
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # Trusted Publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Release tag $TAG does not match package.json ($VERSION)"
            exit 1
          fi
      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      # prepublishOnly runs lint, tests and the build before publishing.
      # Provenance is added automatically with Trusted Publishing.
      - run: npm publish --access public --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
