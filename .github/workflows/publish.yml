name: Publish to npm

# Uses npm Trusted Publishing (OIDC): no token. On npmjs.com, the package's Trusted Publisher must be
# GitHub Actions, user ducminhquan, repository qr-code-styling, workflow publish.yml.
# https://docs.npmjs.com/trusted-publishers
#
# Versions are staged (npm stage publish), not published directly: approve each one on npmjs.com
# (or with `npm stage approve <id>`, which asks for 2FA) to make it live.
#
# - Pushing a version tag (git tag v2.0.0 && git push origin v2.0.0) stages that version as "latest" and creates
#   its GitHub release with the CHANGELOG section. Creating a release with a new tag on github.com pushes
#   the tag too, so it does the same (only once).
#   Tags with a "-" (v2.1.0-beta.1) are pre-releases and use the npm dist-tag "next".
# - "Run workflow" with a version (for example 2.0.0) does the same from the chosen branch and creates the tag.
# - "Run workflow" with no version publishes the versions 1.6.0 to 1.14.0 that were never released, oldest first,
#   from the commit of each version. They get the npm dist-tag "previous", so "latest" is not moved, and
#   each gets a git tag and a GitHub release with its CHANGELOG section. Versions already on npm are skipped,
#   so the run can be repeated safely.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release from this branch, e.g. 2.0.0 (creates tag v2.0.0). Leave empty to backfill 1.6.0 to 1.14.0."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write # Trusted Publishing and provenance

jobs:
  publish:
    if: github.event_name == 'push' || inputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release for the tag
      id-token: write
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
      PRERELEASE: ${{ contains(github.event_name == 'push' && github.ref_name || inputs.version, '-') && 'true' || 'false' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Release tag $TAG does not match package.json ($VERSION)"
            exit 1
          fi
      # Install with the npm that ships with Node: newer npm versions skip dependency install scripts,
      # which leaves the canvas dev dependency without its native binary and fails the tests.
      - run: npm ci
      - run: npm run typecheck
      # Trusted Publishing and npm stage need npm 11.15.0 or newer.
      - run: npm install -g npm@latest
      # Run the checks and build explicitly: npm stage publish may not run prepublishOnly.
      - run: npm run lint && npm test && npm run build
      # Staged publishing: the version waits on npmjs.com until a maintainer approves it with 2FA
      # (npm stage approve <id>, or the website). Needs npm 11.15.0 or newer.
      - run: npm stage publish --access public --provenance --tag ${{ env.PRERELEASE == 'true' && 'next' || 'latest' }}
      - name: GitHub release for the tag
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          awk -v v="## ${TAG#v}" '$0 == v { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" $FLAGS

  backfill:
    if: github.event_name == 'workflow_dispatch' && inputs.version == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # git tag and GitHub release for each version
      id-token: write
    strategy:
      max-parallel: 1
      fail-fast: false # one version failing does not stop the others
      matrix:
        include:
          - { version: 1.6.0, sha: 0d1bb4f8ff236d3e3c50164cd73436f08641ed15 }
          - { version: 1.7.0, sha: 57cbfe7670f742e59572b7b73cff57b942455cf2 }
          - { version: 1.8.0, sha: 441a7314accc620eadcbb19ab47eb5235b3dc926 }
          - { version: 1.9.0, sha: 8b7dc8dce3324ae07475b39ad9297d3846937ebd }
          - { version: 1.10.0, sha: 89b06d52b97f1113954e8528970b683098dc73f6 }
          - { version: 1.11.0, sha: b98dbc794ff6a7869bd5c5bdcd5cd1bd495d8fa1 }
          - { version: 1.12.0, sha: c73630012868081bd9208f040a1a66adba3fa163 }
          - { version: 1.13.0, sha: a7714966e0a4e505226fe1254b2f252374814aa5 }
          - { version: 1.14.0, sha: b4e56d5662810453f1a1d4929f2d1e03db1326fe }
    env:
      VERSION: ${{ matrix.version }}
      SHA: ${{ matrix.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Skip if already on npm
        id: check
        run: |
          if npm view "qr-code-styling-node@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION is already on npm, skipping the publish."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes from the CHANGELOG
        run: |
          awk -v v="## $VERSION" '$0 == v { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
      - name: Check out the version's commit
        run: |
          git checkout --detach "$SHA"
          test "$(node -p "require('./package.json').version")" = "$VERSION"
      # npm ci with the npm that ships with Node (see the publish job), then the newer npm for publishing.
      - if: steps.check.outputs.published == 'false'
        run: npm ci
      - if: steps.check.outputs.published == 'false'
        run: npm install -g npm@latest
      # Lint, tests and build of that version (npm stage publish may not run prepublishOnly).
      - if: steps.check.outputs.published == 'false'
        run: npm run lint && npm test && npm run build
      - if: steps.check.outputs.published == 'false'
        run: npm stage publish --access public --provenance --tag previous
      - name: Git tag and GitHub release
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
          else
            gh release create "v$VERSION" --target "$(git rev-parse HEAD)" --title "v$VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" --latest=false
          fi
